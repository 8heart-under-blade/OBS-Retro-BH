<!doctype html><html><body><pre id="result">WAITING</pre><iframe id="app" style="width:960px;height:540px;border:0"></iframe><script>
const frame=document.querySelector('#app'),result=document.querySelector('#result');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(check){for(let i=0;i<100;i++){if(check())return;await wait(80);}throw new Error('Timed out');}
frame.onload=async()=>{
let controls,scene;
try{
const w=frame.contentWindow,d=frame.contentDocument,errors=[];w.addEventListener('error',e=>errors.push(e.message));
({scene,audioControls:controls}=w.eval('({scene,audioControls})'));
await until(()=>d.querySelector('#audio-state').textContent==='LIVE OBS AUDIO'&&scene.audio.level>.05);
if(d.querySelectorAll('#audio-sources option').length<2)throw new Error('Active source list missing');
d.querySelector('#audio-source').value='Missing source';d.querySelector('#audio-source').dispatchEvent(new Event('change'));
await wait(1500);if(scene.audio.level>.16)throw new Error('Source filter did not decay');
d.querySelector('#audio-source').value='Music';d.querySelector('#audio-source').dispatchEvent(new Event('change'));
await until(()=>scene.audio.level>.1);
d.querySelector('#audio-open').click();if(!d.querySelector('#audio-panel').open)throw new Error('Audio settings did not open');
d.querySelector('#audio-mode').value='off';d.querySelector('#audio-apply').click();if(d.querySelector('#audio-state').textContent!=='AUDIO OFF')throw new Error('Off mode failed');
d.querySelector('#audio-mode').value='demo';d.querySelector('#audio-apply').click();if(!d.querySelector('#audio-state').textContent.includes('NOT LIVE AUDIO'))throw new Error('Demo not labeled');
await until(()=>scene.audio.level>.1);d.querySelector('#audio-close').click();
scene.pause();const changed=[];
for(const name of ['starting','goodbye','brb']){
scene.setScene(name);if(name==='brb')await until(()=>!!scene.map);
scene.time=10;scene.audio={level:0,swell:0,accent:0};scene.render();
const a=scene.ctx.getImageData(0,0,scene.canvas.width,scene.canvas.height).data;
scene.audio={level:.6,swell:.5,accent:.4};scene.render();const b=scene.ctx.getImageData(0,0,scene.canvas.width,scene.canvas.height).data;
let diff=0;for(let i=0;i<a.length;i+=4)if(Math.abs(a[i]-b[i])>3)diff++;
if(diff<100)throw new Error(name+' did not visibly react: '+diff);changed.push(name+': '+diff);
}
if(errors.length)throw new Error(errors.join('; '));
result.textContent='PASS: actual browser OBS v5 handshake, live meters, source filtering, settings UI, and reactive renders ('+changed.join(', ')+'); simulated server, not real OBS';
}catch(e){result.textContent='FAIL: '+e.message;}finally{controls?.destroy();scene?.destroy();}
};
const endpoint=new URLSearchParams(location.search).get('mock');
if(!endpoint)result.textContent='FAIL: use node scratch/poc/browser-smoke.cjs audio-smoke.html';
else frame.src='index.html?audio=obs&source=Music&obsws='+encodeURIComponent(endpoint);
</script></body></html>
