<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celestial Ink · OBS POC</title>
<style>
:root{color-scheme:dark;--ink:#d9dac0;--muted:#777e6b;--bg:#090c0b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}body{font-family:Consolas,'Courier New',monospace}canvas{position:absolute;width:100%;height:100%;inset:0}header,footer,.title,nav{position:absolute;z-index:1}header{inset:5.6% 5.5% auto;display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;color:var(--muted)}.signal{color:var(--ink)}.signal:before{content:'●';font-size:8px;margin-right:12px}header span:last-child{text-align:right}.title{left:8%;bottom:15%;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:4px;color:var(--muted);margin-bottom:19px}h1{font:normal clamp(30px,4.8vw,84px)/1.05 Georgia,serif;letter-spacing:-2px;margin:0 0 18px}#subtitle{font-size:11px;letter-spacing:2px;color:var(--muted)}footer{bottom:5.5%;left:5.5%;right:5.5%;display:flex;justify-content:space-between;border-top:1px solid #282e26;padding-top:15px;font-size:9px;letter-spacing:2px;color:var(--muted)}nav{right:5.5%;bottom:14%;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:89%}button{border:1px solid #343b30;background:var(--bg);color:var(--muted);padding:9px 12px;font:10px Consolas,monospace;cursor:pointer}button[aria-pressed=true]{color:var(--ink);border-color:var(--muted)}body.obs nav{display:none}dialog{width:min(420px,94vw);border:1px solid #555e49;background:#101510;color:var(--ink);padding:24px;font:12px/1.5 Consolas,monospace}dialog::backdrop{background:#0009}dialog h2{font-size:14px;letter-spacing:2px;margin:0 0 16px}dialog label{display:block;margin:12px 0}dialog input,dialog select{display:block;width:100%;margin-top:5px;padding:8px;background:#090c0b;border:1px solid #414b37;color:var(--ink);font:12px Consolas,monospace}dialog input[type=range]{padding:0}dialog p{font-size:10px;color:#9aa18c}dialog progress{width:100%;height:6px;accent-color:#c6cdae}dialog .actions{display:flex;gap:8px;margin-top:16px}#audio-state{font-size:10px;letter-spacing:1px;overflow-wrap:anywhere}@media(max-width:650px){header{font-size:8px;letter-spacing:1px}.title{bottom:19%}nav{bottom:10%}footer{font-size:7px}h1{letter-spacing:-1px}}
</style></head><body>
<canvas id="space" aria-label="Animated monochrome celestial illustration"></canvas>
<header><span class="signal">CELESTIAL OBSERVATORY</span><span id="coordinates"></span></header>
<main class="title"><div class="eyebrow" id="chapter"></div><h1 id="heading"></h1><div id="subtitle"></div></main>
<nav aria-label="Scene preview"><button data-scene="starting">01 STARTING</button><button data-scene="brb">02 BRB</button><button data-scene="goodbye">03 GOODBYE</button><button id="motion">PAUSE</button><button id="audio-open">AUDIO</button></nav>
<dialog id="audio-panel" aria-labelledby="audio-title"><h2 id="audio-title">AUDIO REACTIONS</h2>
<div id="audio-state" role="status" aria-live="polite">AUDIO OFF</div><progress id="audio-meter" max="1" value="0" aria-label="Smoothed audio level"></progress>
<label>Mode<select id="audio-mode"><option value="obs">OBS WebSocket</option><option value="off">Off</option><option value="demo">Visual demo — not live audio</option></select></label>
<label>OBS address<input id="audio-url" value="ws://127.0.0.1:4445" spellcheck="false"></label>
<label>Password (only if OBS authentication is enabled)<input id="audio-password" type="password" autocomplete="off"></label>
<label>Input name or UUID (blank = strongest active input)<input id="audio-source" list="audio-sources" placeholder="e.g. Desktop Audio" spellcheck="false"><datalist id="audio-sources"></datalist></label>
<label>Reaction intensity<input id="audio-strength" type="range" min="0" max="1" step="0.05" value="0.65"></label>
<p>Reads OBS input loudness/peaks only; no recording or audio playback. Not frequency analysis. Settings stay in memory. Press A to open these controls inside OBS Interact.</p>
<div class="actions"><button id="audio-apply">APPLY / CONNECT</button><button id="audio-close">CLOSE</button></div></dialog>
<footer><span>CELESTIAL INK / PROOF OF CONCEPT</span><span id="footer-label"></span></footer>
<script src="orbits.js"></script><script src="solar-model.js"></script><script src="blackhole-grain.js"></script><script src="celestial-ink.js"></script><script src="audio-reactive.js"></script><script src="audio-ui.js"></script><script src="app.js"></script></body></html>
