name: Production release

on:
  push:
    branches: [prod]
    tags: ['v*']
  pull_request:
    branches: [prod]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -s LICENSE
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            prod=$(git ls-remote --exit-code origin refs/heads/prod | cut -f1)
            test "$(git rev-parse HEAD)" = "$prod" || {
              echo 'Release tags must point to the current prod commit.' >&2
              exit 1
            }
            test -s "docs/RELEASE-NOTES-$version.md"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    name: Build and verify (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
            ext: zip
          - target: linux-x64
            os: ubuntu-24.04
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
      - run: npm test
      - run: npm run test:poc
      - name: Build, verify startup, and check archive digest
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          archive="obs-retro-bh-$VERSION-$TARGET.$EXT"
          node scripts/build-portable.mjs --target "$TARGET"
          node scripts/build-portable.mjs --verify "dist/$archive" --target "$TARGET"
          (cd dist && sha256sum -c "$archive.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/obs-retro-bh-${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.ext }}
            dist/obs-retro-bh-${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.ext }}.sha256
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create draft GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: draft-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify downloads and prepare release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          windows="obs-retro-bh-$VERSION-windows-x64.zip"
          linux="obs-retro-bh-$VERSION-linux-x64.tar.gz"
          prod=$(git ls-remote --exit-code origin refs/heads/prod | cut -f1)
          test "$(git rev-parse HEAD)" = "$prod" || {
            echo 'prod advanced while the release was building; no draft was created.' >&2
            exit 1
          }
          (
            cd release-assets
            sha256sum -c "$windows.sha256" "$linux.sha256"
            sha256sum "$windows" "$linux" > SHA256SUMS
          )
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "OBS Retro-BH $VERSION" --notes-file "docs/RELEASE-NOTES-$VERSION.md" \
            "release-assets/$windows" "release-assets/$linux" release-assets/SHA256SUMS
