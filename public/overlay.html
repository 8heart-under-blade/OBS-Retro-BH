<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scene typography</title><link rel="stylesheet" href="/css/overlay.css"><style id="basic-style"></style><style id="global-style"></style><style id="custom-style"></style></head>
<body><main class="scene-root" id="scene-root" data-scene="starting" data-theme="meridian">
<section id="captions" aria-label="Scene caption"><h1 id="scene-title" class="module"></h1><div id="scene-mark" aria-hidden="true" hidden></div><p id="scene-subtitle" class="module"></p><p id="scene-next-stream" class="module"></p><p id="scene-announcement" class="module"></p><p id="scene-social" class="module"></p></section>
<aside id="module-rail"><div id="scene-timer" class="module"><p id="timer-label"></p><p id="timer-value"></p></div></aside>
<aside id="time-rail"><time id="scene-clock" class="module"></time><time id="scene-date" class="module"></time></aside>
</main><script type="module" src="/js/overlay.mjs"></script></body></html>
